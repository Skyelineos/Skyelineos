# Auto-deploy to Firebase on every push to main.
#
# Authentication: Workload Identity Federation (WIF). The job mints a GitHub
# OIDC token (gated by the job-level id-token: write permission) and exchanges
# it for short-lived Google Cloud credentials via the github-actions WIF pool.
# No long-lived FIREBASE_TOKEN needed. After the auth step runs, firebase-tools
# picks up creds from the ambient gcloud context automatically.
#
# WIF setup (already done in GCP):
#   * Project number: 1062333414392
#   * Pool: github-actions
#   * Provider: github
#   * Service account: github-actions-deployer@skyelineos.iam.gserviceaccount.com
#   * Principal bound: principalSet://iam.googleapis.com/projects/1062333414392/
#       locations/global/workloadIdentityPools/github-actions/attribute.repository/
#       Skyelineos/Skyelineos  (with roles/iam.workloadIdentityUser)
#
# Safety:
#   - Only triggers on push to main + manual dispatch. No pull_request trigger.
#   - concurrency: cancels stale runs when a newer push lands.
#   - Deploy step has an explicit `if:` guard as belt-and-suspenders.
#   - Deploy lock check at the top aborts if a QA run is in progress.

name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # Required for Workload Identity Federation — the deploy job needs
    # permission to mint a GitHub OIDC token for google-github-actions/auth.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Deploy lock — if a QA run is in flight (system/deployLock.locked == true),
      # abort so nothing ships mid-test and breaks the run. Reads the flag from
      # Firestore's public REST endpoint (the doc is world-readable by rule).
      # Re-run this job from the Actions tab once the QA run finishes.
      - name: Check deploy lock
        run: |
          URL="https://firestore.googleapis.com/v1/projects/skyelineos/databases/(default)/documents/system/deployLock"
          LOCKED=$(curl -s "$URL" | jq -r '.fields.locked.booleanValue // false' 2>/dev/null || echo false)
          echo "deployLock.locked = $LOCKED"
          if [ "$LOCKED" = "true" ]; then
            echo "::error::Deploy blocked — a QA run is in progress (system/deployLock). Re-run this job once it finishes."
            exit 1
          fi

      # Authenticate to Google Cloud via Workload Identity Federation.
      # On success this exports GOOGLE_APPLICATION_CREDENTIALS pointing at a
      # short-lived credentials file that firebase-tools (and gcloud) pick up
      # automatically. No --token flag needed on the deploy command.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1062333414392/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@skyelineos.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Build functions (tsc)
        working-directory: functions
        run: npm run build

      # Vite build needs VITE_FIREBASE_APP_CHECK_KEY baked into the bundle so
      # initializeFirebaseAppCheck() can register with the reCAPTCHA v3 site
      # key in production. Set the value at:
      #   Settings → Secrets and variables → Actions → VITE_FIREBASE_APP_CHECK_KEY
      # The secret can be empty in non-prod; the boot guard in client/src/lib/
      # firebase.ts no-ops when the key is missing.
      - name: Build hosting bundle (vite)
        run: npm run build
        env:
          VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      # WIF-authenticated deploy. firebase-tools reads GOOGLE_APPLICATION_CREDENTIALS
      # set by the auth step. No --token flag.
      - name: Deploy
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project skyelineos --force --non-interactive

# Auto-deploy to Firebase on every push to main.
#
# Authentication: Workload Identity Federation (WIF). The job mints a GitHub
# OIDC token (gated by the job-level id-token: write permission) and exchanges
# it for short-lived Google Cloud credentials via the github-actions WIF pool.
# No long-lived FIREBASE_TOKEN needed. After the auth step runs, firebase-tools
# picks up creds from the ambient gcloud context automatically.
#
# WIF setup (already done in GCP):
#   * Project number: 1062333414392
#   * Pool: github-actions
#   * Provider: github
#   * Service account: github-actions-deployer@skyelineos.iam.gserviceaccount.com
#   * Principal bound: principalSet://iam.googleapis.com/projects/1062333414392/
#       locations/global/workloadIdentityPools/github-actions/attribute.repository/
#       Skyelineos/Skyelineos  (with roles/iam.workloadIdentityUser)
#
# Safety:
#   - Only triggers on push to main + manual dispatch. No pull_request trigger.
#   - concurrency: cancels stale runs when a newer push lands.
#   - Deploy step has an explicit `if:` guard as belt-and-suspenders.
#   - Deploy lock check at the top aborts if a QA run is in progress.

name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # Required for Workload Identity Federation — the deploy job needs
    # permission to mint a GitHub OIDC token for google-github-actions/auth.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Deploy lock — if a QA run is in flight (system/deployLock.locked == true),
      # abort so nothing ships mid-test and breaks the run. Reads the flag from
      # Firestore's public REST endpoint (the doc is world-readable by rule).
      # Re-run this job from the Actions tab once the QA run finishes.
      - name: Check deploy lock
        run: |
          URL="https://firestore.googleapis.com/v1/projects/skyelineos/databases/(default)/documents/system/deployLock"
          RESP=$(curl -s "$URL" 2>/dev/null || echo "{}")
          LOCKED=$(echo "$RESP" | jq -r '.fields.locked.booleanValue // false' 2>/dev/null || echo false)
          LOCKED_AT=$(echo "$RESP" | jq -r '.fields.lockedAt.timestampValue // empty' 2>/dev/null || echo "")
          LOCKED_BY=$(echo "$RESP" | jq -r '.fields.lockedBy.stringValue // empty' 2>/dev/null || echo "")
          QA_RUN_ID=$(echo "$RESP" | jq -r '.fields.qaRunId.stringValue // empty' 2>/dev/null || echo "")
          echo "deployLock.locked  = $LOCKED"
          echo "deployLock.lockedAt = $LOCKED_AT"
          echo "deployLock.lockedBy = $LOCKED_BY"
          echo "deployLock.qaRunId  = $QA_RUN_ID"

          if [ "$LOCKED" != "true" ]; then
            echo "Lock is clear — proceeding."
            exit 0
          fi

          # TTL safety net — if the lock has been held for > 30 minutes, treat
          # as stale and proceed with a warning. The QA workflow has an
          # if:always() release step now, so a stuck lock past this window
          # almost certainly means the trigger fired but the workflow_dispatch
          # never reached the runner (rare GitHub Actions failure) OR the
          # release POST itself broke. Either way, holding deploys indefinitely
          # is worse than risking a deploy mid-QA-run.
          if [ -z "$LOCKED_AT" ]; then
            echo "::warning::Lock is set but lockedAt is missing — pre-TTL lock format. Treating as stale; proceeding."
            exit 0
          fi

          # Compute lock age in seconds. Firestore timestamps are ISO 8601 UTC.
          LOCK_EPOCH=$(date -u -d "$LOCKED_AT" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date -u +%s)
          AGE=$(( NOW_EPOCH - LOCK_EPOCH ))
          TTL_SEC=$(( 30 * 60 ))
          echo "Lock age: ${AGE}s (TTL: ${TTL_SEC}s)"

          if [ "$AGE" -gt "$TTL_SEC" ]; then
            echo "::warning::Lock is stale (age ${AGE}s > ${TTL_SEC}s TTL). Held by '$LOCKED_BY' for qa run '$QA_RUN_ID'. Proceeding anyway. If a QA run truly is in flight, the deploy may interrupt it."
            exit 0
          fi

          echo "::error::Deploy blocked — a QA run is in progress (held by '$LOCKED_BY', qa run '$QA_RUN_ID', age ${AGE}s). Re-run this job after the QA run finishes, or clear system/deployLock in the Firebase Console."
          exit 1

      # Authenticate to Google Cloud via Workload Identity Federation.
      # On success this exports GOOGLE_APPLICATION_CREDENTIALS pointing at a
      # short-lived credentials file that firebase-tools (and gcloud) pick up
      # automatically. No --token flag needed on the deploy command.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1062333414392/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@skyelineos.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Build functions (tsc)
        working-directory: functions
        run: npm run build

      # Vite build needs VITE_FIREBASE_APP_CHECK_KEY baked into the bundle so
      # initializeFirebaseAppCheck() can register with the reCAPTCHA v3 site
      # key in production. Set the value at:
      #   Settings → Secrets and variables → Actions → VITE_FIREBASE_APP_CHECK_KEY
      # The secret can be empty in non-prod; the boot guard in client/src/lib/
      # firebase.ts no-ops when the key is missing.
      - name: Build hosting bundle (vite)
        run: npm run build
        env:
          VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      # WIF-authenticated deploy. firebase-tools reads GOOGLE_APPLICATION_CREDENTIALS
      # set by the auth step. No --token flag.
      - name: Deploy
        id: deploy
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project skyelineos --force --non-interactive 2>&1 | tee deploy.log

      # Tyler asked for an email on every push that triggers a deploy so he
      # can scan his inbox at a glance. Both steps below skip when the workflow
      # is cancelled (the concurrency block kills stale runs - not worth an
      # email). All complex logic lives in scripts/notify-deploy.sh so the YAML
      # stays simple. Script falls back to a warning and exit 0 if any secret
      # is missing, so notification failures never break the deploy.
      #
      # Operator setup: add DEPLOY_NOTIFY_TO_EMAIL to repo secrets via
      # Settings > Secrets and variables > Actions. Other two SendGrid secrets
      # are already configured for bid packages and estimate sends.
      - name: Notify Tyler on success
        if: success()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.DEPLOY_NOTIFY_TO_EMAIL }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: bash scripts/notify-deploy.sh ok

      - name: Notify Tyler on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.DEPLOY_NOTIFY_TO_EMAIL }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: bash scripts/notify-deploy.sh fail

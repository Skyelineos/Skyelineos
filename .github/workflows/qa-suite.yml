# QA harness — on-demand trigger layer over the self-cleaning E2E harness (#89).
#
# Triggered by the admin "Test app" button → POST /api/qa/trigger, which sets
# the deploy lock, creates qa_runs/{run_id}, and dispatches this workflow. We run
# the existing self-cleaning suite (scripts/e2e/run.mjs) against live; it streams
# results into qa_runs (the dashboard panel reads them live) and clears the
# deploy lock on its final report. Created test data is auto-deleted by the
# harness teardown — even on failure.
#
# Required GitHub Actions secrets:
#   QA_REPORT_TOKEN        — shared bearer (same value as the Secret Manager
#                            secret) used to POST results to /api/qa/report
#   E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD          — dedicated test admin login
#   VITE_FIREBASE_API_KEY / VITE_FIREBASE_AUTH_DOMAIN / VITE_FIREBASE_PROJECT_ID /
#   VITE_FIREBASE_STORAGE_BUCKET / VITE_FIREBASE_MESSAGING_SENDER_ID /
#   VITE_FIREBASE_APP_ID                          — public Firebase web config
# GITHUB_TOKEN (built-in) opens an issue on failure.

name: QA Suite
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'qa_runs doc id to report into'
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-suite
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      # Reporting back to the dashboard + lock release
      E2E_RUN_ID: ${{ github.event.inputs.run_id }}
      E2E_REPORT_URL: https://skyelineos.web.app/api/qa/report
      E2E_REPORT_TOKEN: ${{ secrets.QA_REPORT_TOKEN }}
      E2E_CONFIRM: '1'
      # Target + test admin
      E2E_BASE_URL: https://skyelineos.web.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Public Firebase web config (used by the harness firebase web SDK)
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install chromium (for the UI suite)
        run: npx playwright install chromium

      # Self-cleaning suite: data (taskLibrary) + UI smoke. Streams to qa_runs.
      # continue-on-error: a normal run that finds failures exits non-zero — that
      # is NOT a workflow crash. The runner posts its own final report (with the
      # real error/results) and writes qa-report.json; we only treat a MISSING
      # report as a true crash below.
      - name: Run E2E suite
        continue-on-error: true
        run: node scripts/e2e/run.mjs --ui --yes

      # Step 1 — backstop the runner's own final report.
      # If the runner crashed before producing qa-report.json, post a final
      # error report so the qa_runs dashboard reflects the crash + the deploy
      # lock release fires via the existing phase:'final' code path.
      - name: Report runner crash if no qa-report.json
        if: always()
        run: |
          if [ ! -f qa-report.json ]; then
            echo "No qa-report.json — runner crashed; posting error final."
            curl -s -X POST "$E2E_REPORT_URL" \
              -H "Authorization: Bearer $E2E_REPORT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"runId\":\"$E2E_RUN_ID\",\"phase\":\"final\",\"patch\":{\"status\":\"error\",\"error\":\"workflow crashed before producing a report\"}}" || true
          fi

      # Step 2 — unconditional deploy-lock release.
      # Even if the runner produced qa-report.json AND posted its own final, the
      # report POST could have transient-failed network-wise without the runner
      # noticing. This step ALWAYS POSTs releaseLock=true so the lock cannot
      # stay set after this workflow ends, for any reason (success, fail,
      # cancel, timeout). The release endpoint is idempotent and respects
      # ownership (qaRunId) so a stomp on a manual lock or a newer QA run is
      # impossible.
      #
      # Includes runUrl so /api/qa/report can stamp it on the deploy lock doc
      # for future debugging ('here's the GH run that held the lock').
      - name: Release deploy lock (always)
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Always-release: POST releaseLock=true for run $E2E_RUN_ID (runUrl=$RUN_URL)"
          curl -s -X POST "$E2E_REPORT_URL" \
            -H "Authorization: Bearer $E2E_REPORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"runId\":\"$E2E_RUN_ID\",\"releaseLock\":true,\"runUrl\":\"$RUN_URL\"}" || true

      - name: Open issue on failed checks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = null;
            try { report = JSON.parse(fs.readFileSync('qa-report.json', 'utf8')); } catch {}
            if (!report || ((report.summary?.failed ?? 0) + (report.summary?.errored ?? 0)) === 0) {
              core.info('No failed checks — no issue opened.');
              return;
            }
            const s = report.summary;
            const lines = (report.checks || [])
              .filter(c => c.status !== 'ok')
              .slice(0, 40)
              .map(c => `- \`${c.name}\` — **${c.status}**${c.error ? ` · ${c.error}` : ''}`);
            const body = [
              `Automated QA run \`${process.env.E2E_RUN_ID}\` found issues.`,
              ``,
              `**Summary:** ${s.passed} passed · ${s.failed} failed · ${s.errored} errored`,
              ``,
              `### Failing checks`,
              ...lines,
              ``,
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `QA run found ${s.failed + s.errored} issue(s) — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['qa', 'automated'],
            });

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            qa-report.json
            scripts/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14
